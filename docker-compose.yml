services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: algo
      POSTGRES_DB: algo_trading
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  algo-trading:
    build:
      context: .
    image: binance-algo-trading:local
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    volumes:
      - ./runs:/app/runs
      - ./historical_data:/app/historical_data
      - ./logs:/app/logs
    environment:
      PYTHONUNBUFFERED: "1"
      APP_LOG_DIR: /app/logs
      DATABASE_URL: postgresql://algo:algo@postgres:5432/algo_trading
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE: maintenance
      API_RESPONSE_CACHE_ENABLED: "1"
      API_CACHE_TTL_SYMBOLS_SECONDS: "30"
      API_CACHE_TTL_LIVE_SYMBOLS_SECONDS: "300"
      API_CACHE_TTL_LIVE_CHART_SECONDS: "10"
      API_CACHE_TTL_MARKET_BREADTH_SECONDS: "300"
      API_CACHE_TTL_FUTOI_SECONDS: "60"
      API_CACHE_TTL_FUTOI_INSTRUMENTS_SECONDS: "300"
      MARKET_BREADTH_DATA_DIR: /app/historical_data/breadth
      MARKET_BREADTH_RETENTION_DAYS: "365"
      HISTORICAL_DATA_DIR: /app/historical_data
      HISTORICAL_CSV_RETENTION_DAYS: "1095"
      HISTORICAL_CSV_REFRESH_SECONDS: "3600"
      HISTORICAL_CSV_PRUNE_SECONDS: "86400"
      MOEX_FUTOI_DATA_DIR: /app/historical_data/futoi
      MOEX_FUTOI_RETENTION_DAYS: "730"
      MOEX_FUTOI_REFRESH_SECONDS: "86400"
      MOEX_FUTOI_PRUNE_SECONDS: "604800"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-cuiyeqing960904@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Vladimir960904}
      MOEX_API_KEY: ${MOEX_API_KEY:-}
      MOEXALGO_API_KEY: ${MOEXALGO_API_KEY:-}
      MOEX_FUTOI_API_KEY: ${MOEX_FUTOI_API_KEY:-}

  worker:
    build:
      context: .
    image: binance-algo-trading:local
    command: python -m algo_trading.worker
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./historical_data:/app/historical_data
      - ./logs:/app/logs
    environment:
      PYTHONUNBUFFERED: "1"
      APP_LOG_DIR: /app/logs
      DATABASE_URL: postgresql://algo:algo@postgres:5432/algo_trading
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE: maintenance
      MARKET_BREADTH_DATA_DIR: /app/historical_data/breadth
      MARKET_BREADTH_RETENTION_DAYS: "365"
      HISTORICAL_DATA_DIR: /app/historical_data
      HISTORICAL_CSV_RETENTION_DAYS: "1095"
      MOEX_FUTOI_DATA_DIR: /app/historical_data/futoi
      MOEX_FUTOI_RETENTION_DAYS: "730"
      MOEX_FUTOI_REFRESH_SECONDS: "86400"
      MOEX_FUTOI_PRUNE_SECONDS: "604800"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-cuiyeqing960904@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Vladimir960904}
      MOEX_API_KEY: ${MOEX_API_KEY:-}
      MOEXALGO_API_KEY: ${MOEXALGO_API_KEY:-}
      MOEX_FUTOI_API_KEY: ${MOEX_FUTOI_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:
