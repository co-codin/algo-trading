services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: algo
      POSTGRES_DB: algo_trading
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  algo-trading:
    build:
      context: .
    image: binance-algo-trading:local
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    volumes:
      - ./runs:/app/runs
      - ./historical_data:/app/historical_data
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://algo:algo@postgres:5432/algo_trading
      MARKET_BREADTH_DATA_DIR: /app/historical_data/breadth

volumes:
  postgres-data:
