[project]
name = "algo-trading"
version = "0.1.0"
description = "Local crypto backtesting and paper trading simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.40,<1",
    "psycopg[binary]>=3.3,<4",
    "redis>=5,<7",
    "rq>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19,<2",
    "pre-commit>=4,<5",
    "ruff>=0.15,<1",
]

[project.scripts]
algo-trading = "algo_trading.cli:main"
algo-trading-ui = "algo_trading.ui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["algo_trading*"]

[tool.setuptools.package-data]
algo_trading = ["web/dist/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "redis", "redis.*", "rq", "rq.*"]
ignore_missing_imports = true
