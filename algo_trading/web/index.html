<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Algo Trading UI</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-mode="backtest">
    <header class="topbar">
      <div>
        <h1>Algo Trading</h1>
        <p>Local backtesting and bounded paper trading</p>
      </div>
      <div class="safety">Read-only: no real orders</div>
    </header>

    <nav class="tabs" aria-label="Modes">
      <button class="tab is-active" type="button" data-mode-tab="backtest">Backtest</button>
      <button class="tab" type="button" data-mode-tab="paper">Paper</button>
      <button class="tab" type="button" data-mode-tab="runs">Runs</button>
    </nav>

    <main>
      <section class="workspace" id="run-workspace">
        <form class="panel settings" id="run-form">
          <div class="panel-heading">
            <h2 id="form-title">Backtest</h2>
            <button class="primary" id="run-button" type="submit">Run Backtest</button>
          </div>

          <div class="symbols-row">
            <label>
              <span id="symbol-label">Symbols</span>
              <input name="symbols" id="symbols-input" value="BTCUSDT" autocomplete="off">
            </label>
            <label class="small-field">
              <span>Top</span>
              <input name="top" id="top-input" type="number" min="1" max="25" value="5">
            </label>
            <button class="secondary" id="load-symbols" type="button">Load Top</button>
          </div>

          <div class="symbol-list" id="symbol-list" aria-live="polite"></div>

          <div class="field-grid">
            <label>
              <span>Interval</span>
              <input name="interval" value="1h" autocomplete="off">
            </label>
            <label>
              <span>Candles</span>
              <input name="limit" type="number" min="1" value="300">
            </label>
            <label>
              <span>Side</span>
              <select name="allowed_side">
                <option value="both">Both</option>
                <option value="long-only">Long only</option>
                <option value="short-only">Short only</option>
              </select>
            </label>
            <label>
              <span>Starting USDT</span>
              <input name="starting_balance" type="number" min="1" step="0.01" value="10000">
            </label>
            <label>
              <span>Position Fraction</span>
              <input name="position_fraction" type="number" min="0.01" max="1" step="0.01" value="1">
            </label>
            <label>
              <span>Fee Rate</span>
              <input name="fee_rate" type="number" min="0" step="0.0001" value="0.001">
            </label>
            <label>
              <span>Slippage</span>
              <input name="slippage_rate" type="number" min="0" step="0.0001" value="0.0005">
            </label>
            <label>
              <span>Fast EMA</span>
              <input name="fast_ema" type="number" min="1" value="12">
            </label>
            <label>
              <span>Slow EMA</span>
              <input name="slow_ema" type="number" min="1" value="26">
            </label>
            <label>
              <span>RSI Period</span>
              <input name="rsi_period" type="number" min="1" value="14">
            </label>
            <label>
              <span>RSI Overbought</span>
              <input name="rsi_overbought" type="number" min="1" max="100" step="0.1" value="70">
            </label>
            <label>
              <span>RSI Oversold</span>
              <input name="rsi_oversold" type="number" min="0" max="99" step="0.1" value="30">
            </label>
            <label>
              <span>Stop Loss</span>
              <input name="stop_loss_pct" type="number" min="0" step="0.001" value="0.03">
            </label>
            <label>
              <span>Take Profit</span>
              <input name="take_profit_pct" type="number" min="0" step="0.001" value="0.06">
            </label>
            <label>
              <span>Trailing Stop</span>
              <input name="trailing_stop_pct" type="number" min="0" step="0.001" value="0">
            </label>
            <label class="backtest-only">
              <span>Retries</span>
              <input name="market_data_retries" type="number" min="0" value="2">
            </label>
            <label class="backtest-only">
              <span>Retry Delay</span>
              <input name="retry_delay" type="number" min="0" step="0.1" value="0.5">
            </label>
            <label class="paper-only">
              <span>Iterations</span>
              <input name="iterations" type="number" min="1" value="3">
            </label>
            <label class="paper-only">
              <span>Poll Seconds</span>
              <input name="poll_seconds" type="number" min="0" step="0.5" value="30">
            </label>
          </div>
        </form>

        <section class="panel output">
          <div class="panel-heading">
            <h2>Output</h2>
            <div class="status" id="status">Ready</div>
          </div>
          <div id="result" class="result-grid"></div>
        </section>
      </section>

      <section class="panel runs-panel" id="runs-panel">
        <div class="panel-heading">
          <h2>Runs</h2>
          <button class="secondary" id="refresh-runs" type="button">Refresh</button>
        </div>
        <div class="runs-layout">
          <div id="runs-list" class="runs-list"></div>
          <div id="run-detail" class="run-detail"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
